[versions]
agp = "8.5.1"
androidx-activityCompose = "1.9.0"
androidx-ui-tooling = "1.6.8"
compose-plugin = "1.6.11"
kamel = "0.9.5"
koin = "3.5.6"
kotlin = "2.0.0"
ktor = "2.3.11"
voyager = "1.0.0"
androidx-datastore = "1.1.1"

agora-syncmanager = "2.2.11.1"
zego-video = "3.15.1"
agora-rtc = "4.3.2"
accompanist-permissions = "0.35.1-alpha"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-datastore = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidx-datastore" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "androidx-ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "androidx-ui-tooling" }
kamel = { module = "media.kamel:kamel-image", version.ref = "kamel" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
voyager-koin = { module = "cafe.adriel.voyager:voyager-koin", version.ref = "voyager" }
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }

agora-syncmanager = {module = "com.github.AgoraIO-Community:SyncManager-Android", version.ref = "agora-syncmanager"}
agora-rtc = { module = "io.agora.rtc:full-sdk", version.ref = "agora-rtc"}
accompanist-permissions = {module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist-permissions"}

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
